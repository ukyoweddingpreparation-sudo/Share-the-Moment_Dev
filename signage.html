<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>L'Eternel Moment - Wedding Signage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Shippori+Mincho:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #0c0b0a;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Shippori Mincho', serif;
        }

        /* 🚪 起動時ラグジュアリー・スプラッシュ画面（極上のミニマル＆ハイエンドUI） */
        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(12, 11, 10, 0.5), rgba(12, 11, 10, 0.8)), 
                        url('./SignageApp-bg-resorce.JPEG') center/cover no-repeat;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: opacity 1.8s cubic-bezier(0.25, 1, 0.5, 1);
        }
        #loadingScreen.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        /* 画面を囲む極細のゴールドフレーム（高級感を演出） */
        #loadingScreen::after {
            content: '';
            position: absolute;
            top: 24px; left: 24px; right: 24px; bottom: 24px;
            border: 1px solid rgba(212, 175, 55, 0.25);
            pointer-events: none;
        }

        .splash-subtitle {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1rem;
            letter-spacing: 0.45em;
            color: #d4af37;
            text-transform: uppercase;
            margin-bottom: 16px;
            font-weight: 400;
            opacity: 0.9;
            animation: fadeInDown 1.5s ease;
        }

        .splash-title {
            font-family: 'Shippori Mincho', serif;
            font-size: 3.4rem;
            letter-spacing: 0.2em;
            color: #ffffff;
            margin-bottom: 20px;
            font-weight: 400;
            text-shadow: 0 4px 30px rgba(0,0,0,0.8);
            animation: fadeInUp 1.5s ease;
        }

        .splash-date {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.25rem;
            letter-spacing: 0.3em;
            color: #e6c567;
            font-weight: 300;
            opacity: 0.95;
            animation: fadeInUp 1.8s ease;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 0.9; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 右下の接続中インジケーター */
        .loading-indicator {
            position: absolute;
            bottom: 45px;
            right: 45px;
            background: rgba(20, 18, 16, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(212, 175, 55, 0.35);
            color: #fcfbfa;
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 0.9rem;
            letter-spacing: 0.12em;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-top-color: #d4af37;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .slide-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .bg-blur {
            position: absolute;
            top: -20px;
            left: -20px;
            right: -20px;
            bottom: -20px;
            background-size: cover;
            background-position: center;
            filter: blur(25px) brightness(0.45);
            transform: scale(1.1);
            z-index: 1;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }
        .bg-blur.active {
            opacity: 1;
        }

        /* 🔍 スライド画像のズームエフェクト（じんわり拡大しながらフェードイン） */
        img.slide-img {
            max-width: 95%;
            max-height: 95%;
            object-fit: contain;
            position: absolute;
            z-index: 2;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 1.5s ease-in-out, transform 4.5s cubic-bezier(0.25, 1, 0.5, 1);
            border-radius: 4px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }
        img.slide-img.active {
            opacity: 1;
            transform: scale(1.03); /* 表示中にじんわりズームイン */
        }

        /* ☁️ 雲の形のメッセージ枠（小幅で優しく波打つアニメーション） */
        .comment-overlay {
            position: absolute;
            bottom: -140px;
            left: 50%;
            background: rgba(22, 20, 18, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1.5px solid rgba(212, 175, 55, 0.55);
            color: #fcfbfa;
            padding: 28px 48px;
            border-radius: 70px / 50px;
            box-shadow: 
                0 20px 50px rgba(0,0,0,0.7), 
                inset 0 0 20px rgba(212, 175, 55, 0.2);
            max-width: 70%;
            text-align: center;
            z-index: 30;
            opacity: 0;
            pointer-events: none;
        }

        .comment-overlay::before,
        .comment-overlay::after {
            content: '';
            position: absolute;
            background: rgba(22, 20, 18, 0.92);
            border: 1.5px solid rgba(212, 175, 55, 0.5);
            border-radius: 50%;
            z-index: -1;
        }
        .comment-overlay::before { width: 80px; height: 80px; top: -30px; left: 40px; }
        .comment-overlay::after { width: 100px; height: 100px; top: -42px; right: 45px; }

        .comment-overlay.animate-gentle-zigzag {
            animation: gentleWaveAscent 10s ease-in-out forwards;
        }

        @keyframes gentleWaveAscent {
            0% { opacity: 0; transform: translate(-50%, 0px) scale(0.88); }
            12% { opacity: 1; transform: translate(-50%, -110px) scale(1); }
            35% { opacity: 1; transform: translate(calc(-50% + 45px), -320px) scale(1); }
            65% { opacity: 1; transform: translate(calc(-50% - 40px), -600px) scale(1); }
            88% { opacity: 0.75; transform: translate(calc(-50% + 20px), -820px) scale(0.96); }
            100% { opacity: 0; transform: translate(-50%, -960px) scale(0.9); }
        }

        .comment-author {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.05rem;
            letter-spacing: 0.18em;
            color: #e6c567;
            margin-bottom: 6px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .comment-text {
            font-size: 1.4rem;
            letter-spacing: 0.08em;
            line-height: 1.6;
            color: #ffffff;
            font-weight: 400;
        }
    </style>
</head>
<body>

    <div id="loadingScreen">
        <div class="splash-subtitle">REAL-TIME PHOTO & MESSAGE SYNC</div>
        <div class="splash-title">L'Éternel Moment</div>
        <div class="splash-date">October 25, 2026</div>

        <div class="loading-indicator">
            <div class="spinner"></div>
            <span id="loadingText">システム接続中...</span>
        </div>
    </div>

    <div class="slide-container" id="slideContainer"></div>

    <script>
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz4XPN95bV-owJeowXFzQ9Z0OIBgI6S31C8QqvX7TdCAas6ZRYes8itFWDy9wSJB6fVhg/exec"; // ★デプロイしたGASのURL
        const FIREBASE_DB_URL = "https://signageresource-syncsystem-default-rtdb.firebaseio.com/trigger.json";

        let images = [];
        let currentIndex = 0;
        let blurEl1, blurEl2, imgElement1, imgElement2;
        let useFirstImage = true;
        let slideTimer = null;
        let lastKnownTimestamp = null;
        let isFirstLoad = true;

        const SHOWN_BATCHES_KEY = "wedding_shown_batches_v2";
        const memoryShownBatches = new Set();

        window.onload = async function() {
            const container = document.getElementById('slideContainer');
            
            blurEl1 = document.createElement('div');
            blurEl1.className = 'bg-blur';
            blurEl2 = document.createElement('div');
            blurEl2.className = 'bg-blur';
            container.appendChild(blurEl1);
            container.appendChild(blurEl2);

            imgElement1 = document.createElement('img');
            imgElement1.className = 'slide-img';
            imgElement2 = document.createElement('img');
            imgElement2.className = 'slide-img';
            container.appendChild(imgElement1);
            container.appendChild(imgElement2);

            await fetchImagesAndRefresh(true);

            slideTimer = setInterval(nextSlide, 4000);
            setInterval(checkFirebaseTrigger, 2000);
        };

        async function checkFirebaseTrigger() {
            try {
                const response = await fetch(FIREBASE_DB_URL);
                const data = await response.json();
                
                if (data && data.timestamp) {
                    if (lastKnownTimestamp === null) {
                        lastKnownTimestamp = data.timestamp;
                    } else if (data.timestamp > lastKnownTimestamp) {
                        console.log('✨ 新着写真を検知！即時割り込み同期を実行します');
                        lastKnownTimestamp = data.timestamp;
                        
                        await fetchImagesAndRefresh(false, true);

                        clearInterval(slideTimer);
                        slideTimer = setInterval(nextSlide, 4000);
                    }
                }
            } catch (e) {
                console.error('Firebase確認エラー:', e);
            }
        }

        function organizeImages(rawImages, isInterrupt = false) {
            const batchMap = {};
            rawImages.forEach(img => {
                const bId = img.batchId || "default";
                if (!batchMap[bId]) batchMap[bId] = [];
                batchMap[bId].push(img);
            });

            Object.keys(batchMap).forEach(bId => {
                batchMap[bId].sort((a, b) => a.createdTime - b.createdTime);
            });

            let batchIds = Object.keys(batchMap);
            batchIds.sort((a, b) => {
                const maxTimeA = Math.max(...batchMap[a].map(img => img.createdTime));
                const maxTimeB = Math.max(...batchMap[b].map(img => img.createdTime));
                return maxTimeB - maxTimeA;
            });

            let latestBatchId = batchIds[0];
            let latestBatchImages = batchMap[latestBatchId] || [];
            
            let otherBatchIds = batchIds.filter(id => id !== latestBatchId);
            for (let i = otherBatchIds.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [otherBatchIds[i], otherBatchIds[j]] = [otherBatchIds[j], otherBatchIds[i]];
            }

            let otherImages = otherBatchIds.flatMap(id => batchMap[id]);

            if (isInterrupt) {
                return [...latestBatchImages, ...otherImages];
            } else {
                let allBatches = batchIds.map(id => batchMap[id]);
                for (let i = allBatches.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [allBatches[i], allBatches[j]] = [allBatches[j], allBatches[i]];
                }
                return allBatches.flat();
            }
        }

        async function fetchImagesAndRefresh(isInitial = false, isInterrupt = false) {
            try {
                const response = await fetch(GAS_WEB_APP_URL, {
                    method: "GET",
                    redirect: "follow" 
                });

                const data = await response.json();
                
                if (data.status === 'success' && data.images.length > 0) {
                    images = organizeImages(data.images, isInterrupt);

                    if (isInitial || isInterrupt) {
                        currentIndex = 0;
                        showImage(currentIndex);

                        if (isFirstLoad) {
                            isFirstLoad = false;
                            setTimeout(() => {
                                const loadingScreen = document.getElementById('loadingScreen');
                                loadingScreen.classList.add('fade-out');
                                setTimeout(() => {
                                    loadingScreen.style.display = 'none';
                                }, 1800);
                            }, 2500);
                        }
                    }
                }
            } catch (e) {
                console.error('画像データ取得エラー:', e);
            }
        }

        function isBatchAlreadyShown(batchId) {
            if (memoryShownBatches.has(batchId)) return true;
            try {
                const shown = JSON.parse(localStorage.getItem(SHOWN_BATCHES_KEY) || '[]');
                if (shown.includes(batchId)) {
                    memoryShownBatches.add(batchId);
                    return true;
                }
            } catch (e) {}
            return false;
        }

        function markBatchAsShown(batchId) {
            memoryShownBatches.add(batchId);
            try {
                const shown = JSON.parse(localStorage.getItem(SHOWN_BATCHES_KEY) || '[]');
                if (!shown.includes(batchId)) {
                    shown.push(batchId);
                    localStorage.setItem(SHOWN_BATCHES_KEY, JSON.stringify(shown));
                }
            } catch (e) {}
        }

        function showImage(index) {
            if (images.length === 0) return;
            const currentItem = images[index];
            const imageUrl = currentItem.url;
            const message = currentItem.message;
            const author = currentItem.author;
            const batchId = currentItem.batchId || "default";

            if (useFirstImage) {
                blurEl1.style.backgroundImage = `url('${imageUrl}')`;
                blurEl1.classList.add('active');
                blurEl2.classList.remove('active');

                imgElement1.src = imageUrl;
                imgElement1.classList.add('active');
                imgElement2.classList.remove('active');
            } else {
                blurEl2.style.backgroundImage = `url('${imageUrl}')`;
                blurEl2.classList.add('active');
                blurEl1.classList.remove('active');

                imgElement2.src = imageUrl;
                imgElement2.classList.add('active');
                imgElement1.classList.remove('active');
            }
            useFirstImage = !useFirstImage;

            const hasMessage = message && message.trim() !== "";
            const isFirstTimeForBatch = hasMessage && !isBatchAlreadyShown(batchId);

            if (isFirstTimeForBatch) {
                markBatchAsShown(batchId);
                triggerFloatingComment(author, message);
            }
        }

        function triggerFloatingComment(author, message) {
            const commentEl = document.createElement('div');
            commentEl.className = 'comment-overlay';
            commentEl.innerHTML = `
                <div class="comment-author">${author ? `${author} 様からのメッセージ` : 'ゲストからのメッセージ'}</div>
                <div class="comment-text">${message}</div>
            `;
            document.body.appendChild(commentEl);

            commentEl.classList.add('animate-gentle-zigzag');

            setTimeout(() => {
                commentEl.remove();
            }, 10000);
        }

        function nextSlide() {
            if (images.length === 0) return;
            currentIndex = (currentIndex + 1) % images.length;
            if (currentIndex === 0) {
                images = organizeImages(images, false);
            }
            showImage(currentIndex);
        }
    </script>
</body>
</html>
