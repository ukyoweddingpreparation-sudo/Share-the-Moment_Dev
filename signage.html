<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ウェディング・フォトサイネージ</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Shippori Mincho', 'Noto Sans JP', sans-serif;
        }
        .slide-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            position: absolute;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }
        img.active {
            opacity: 1;
        }

        /* 💬 コメント風メッセージ演出のスタイル */
        .comment-overlay {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 20, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.4);
            color: #ffffff;
            padding: 16px 28px;
            border-radius: 30px;
            max-width: 80%;
            text-align: center;
            font-size: 1.4rem;
            letter-spacing: 0.05em;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 20;
            opacity: 0;
            transition: opacity 0.8s ease, transform 0.8s ease;
            pointer-events: none;
        }
        .comment-overlay.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .comment-overlay.hide {
            opacity: 0;
            transform: translateX(-50%) translateY(15px);
        }
    </style>
</head>
<body>

    <div class="slide-container" id="slideContainer"></div>
    <div id="commentOverlay" class="comment-overlay"></div>

    <script>
        // ⚙️ 設定：ご自身の環境に合わせて書き換えてください
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz4XPN95bV-owJeowXFzQ9Z0OIBgI6S31C8QqvX7TdCAas6ZRYes8itFWDy9wSJB6fVhg/exec"; // デプロイしたGASのWebアプリURL
        const FIREBASE_DB_URL = "https://signageresource-syncsystem-default-rtdb.firebaseio.com/trigger.json";

        let images = [];
        let currentIndex = 0;
        let imgElement1, imgElement2;
        let useFirstImage = true;
        let slideTimer = null;
        let lastKnownTimestamp = null;
        let commentTimer = null;

        window.onload = async function() {
            const container = document.getElementById('slideContainer');
            
            imgElement1 = document.createElement('img');
            imgElement2 = document.createElement('img');
            container.appendChild(imgElement1);
            container.appendChild(imgElement2);

            // 初回データ取得
            await fetchImagesAndRefresh(true);

            // 4秒ごとにスライド切り替え
            slideTimer = setInterval(nextSlide, 4000);
            
            // 3秒ごとにFirebaseチェック
            setInterval(checkFirebaseTrigger, 3000);
        };

        async function checkFirebaseTrigger() {
            try {
                const response = await fetch(FIREBASE_DB_URL);
                const data = await response.json();
                
                if (data && data.timestamp) {
                    if (lastKnownTimestamp === null) {
                        lastKnownTimestamp = data.timestamp;
                    } else if (data.timestamp > lastKnownTimestamp) {
                        console.log('新着写真の合図を検知しました！即時同期します。');
                        lastKnownTimestamp = data.timestamp;
                        
                        await fetchImagesAndRefresh(false, true);

                        clearInterval(slideTimer);
                        slideTimer = setInterval(nextSlide, 4000);
                    }
                }
            } catch (e) {
                console.error('Firebaseの確認に失敗しました:', e);
            }
        }

        async function fetchImagesAndRefresh(isInitial = false, isInterrupt = false) {
            try {
                const response = await fetch(GAS_WEB_APP_URL, {
                    method: "GET",
                    redirect: "follow" 
                });

                const data = await response.json();
                
                if (data.status === 'success' && data.images.length > 0) {
                    images = data.images;

                    if (isInitial) {
                        showImage(currentIndex);
                    } else if (isInterrupt) {
                        currentIndex = 0;
                        showImage(currentIndex);
                    }
                }
            } catch (e) {
                console.error('画像データの取得に失敗しました:', e);
            }
        }

        function showImage(index) {
            if (images.length === 0) return;
            const currentItem = images[index];
            const imageUrl = currentItem.url;
            const message = currentItem.message;

            // 画像切り替え
            if (useFirstImage) {
                imgElement1.src = imageUrl;
                imgElement1.classList.add('active');
                imgElement2.classList.remove('active');
            } else {
                imgElement2.src = imageUrl;
                imgElement2.classList.add('active');
                imgElement1.classList.remove('active');
            }
            useFirstImage = !useFirstImage;

            // メッセージ演出の制御
            const commentEl = document.getElementById('commentOverlay');
            clearTimeout(commentTimer);

            if (message && message.trim() !== "") {
                commentEl.innerText = message;
                commentEl.classList.remove('hide');
                commentEl.classList.add('show');

                // 約5秒後にコメントをふわっと消す
                commentTimer = setTimeout(() => {
                    commentEl.classList.remove('show');
                    commentEl.classList.add('hide');
                }, 5000);
            } else {
                commentEl.classList.remove('show');
                commentEl.classList.add('hide');
            }
        }

        function nextSlide() {
            if (images.length === 0) return;
            currentIndex = (currentIndex + 1) % images.length;
            showImage(currentIndex);
        }
    </script>
</body>
</html>
