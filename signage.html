<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Wedding Photo Signage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Shippori+Mincho:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1a1816 0%, #0c0b0a 100%);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Shippori Mincho', serif;
        }

        /* 🚪 起動時のローディング（オープニング）画面 */
        .loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* 背景にGitHub上の画像を指定（暗めのフィルターを重ねて高級感を演出） */
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.5)), url('YOUR_WELCOME_IMAGE_URL') center/cover no-repeat;
            z-index: 100;
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
            padding: 50px;
            transition: opacity 1.2s ease-in-out;
        }
        .loading-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        /* 右下の動的接続中インジケーター */
        .loading-indicator {
            background: rgba(20, 18, 16, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(212, 175, 55, 0.45);
            color: #fcfbfa;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 1.1rem;
            letter-spacing: 0.12em;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* くるくる回る動的スピナーアニメーション */
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-top-color: #d4af37;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .slide-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        img {
            max-width: 95%;
            max-height: 95%;
            object-fit: contain;
            position: absolute;
            opacity: 0;
            transition: opacity 1.2s ease-in-out, transform 1.2s ease-in-out;
            transform: scale(0.98);
            border-radius: 4px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }
        img.active {
            opacity: 1;
            transform: scale(1);
        }

        /* ☁️ クラウド型メッセージ枠（下から上へ浮かぶ演出） */
        .comment-overlay {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(40px);
            background: rgba(25, 23, 20, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1.5px solid rgba(212, 175, 55, 0.5);
            color: #fcfbfa;
            padding: 26px 45px;
            border-radius: 60px / 45px;
            box-shadow: 
                0 20px 50px rgba(0,0,0,0.7), 
                inset 0 0 20px rgba(212, 175, 55, 0.15),
                -30px 10px 30px rgba(0,0,0,0.2),
                30px 10px 30px rgba(0,0,0,0.2);
            max-width: 75%;
            text-align: center;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
        }

        .comment-overlay::before,
        .comment-overlay::after {
            content: '';
            position: absolute;
            background: rgba(25, 23, 20, 0.85);
            border: 1.5px solid rgba(212, 175, 55, 0.45);
            border-radius: 50%;
            z-index: -1;
        }
        .comment-overlay::before { width: 70px; height: 70px; top: -25px; left: 35px; }
        .comment-overlay::after { width: 90px; height: 90px; top: -35px; right: 40px; }

        .comment-overlay.show {
            animation: floatUpAndFade 5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes floatUpAndFade {
            0% { opacity: 0; transform: translateX(-50%) translateY(50px) scale(0.92); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0px) scale(1); }
            75% { opacity: 1; transform: translateX(-50%) translateY(-40px) scale(1); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-80px) scale(0.96); }
        }

        .comment-author {
            font-family: 'Cormorant Garamond', 'Shippori Mincho', serif;
            font-size: 1.05rem;
            letter-spacing: 0.18em;
            color: #e6c567;
            margin-bottom: 6px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .comment-text {
            font-size: 1.4rem;
            letter-spacing: 0.08em;
            line-height: 1.6;
            color: #ffffff;
            font-weight: 400;
        }
    </style>
</head>
<body>

    <!-- 🚪 ローディング画面（接続中表示＆背景ウェルカム画像） -->
    <div id="loadingScreen" class="loading-screen">
        <div class="loading-indicator">
            <div class="spinner"></div>
            <span>システム接続中...</span>
        </div>
    </div>

    <div class="slide-container" id="slideContainer"></div>
    <div id="commentOverlay" class="comment-overlay">
        <div id="commentAuthor" class="comment-author"></div>
        <div id="commentText" class="comment-text"></div>
    </div>

    <script>
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz4XPN95bV-owJeowXFzQ9Z0OIBgI6S31C8QqvX7TdCAas6ZRYes8itFWDy9wSJB6fVhg/exec"; // ★デプロイしたGASのURL
        const FIREBASE_DB_URL = "https://signageresource-syncsystem-default-rtdb.firebaseio.com/trigger.json";
        
        // ★必要に応じてGitHub上のウェルカム画像のURLをここに設定してください（index.html等で使っている画像のURL等でもOKです）
        const WELCOME_IMAGE_URL = "https://drive.google.com/thumbnail?id=1ePvmQtV_J-GOBjYiyYDJpWY5HeYGYJME&sz=w1000";

        let images = [];
        let currentIndex = 0;
        let imgElement1, imgElement2;
        let useFirstImage = true;
        let slideTimer = null;
        let lastKnownTimestamp = null;
        let isFirstLoad = true;

        const SHOWN_MESSAGES_KEY = "wedding_shown_messages_v2";

        window.onload = async function() {
            // 背景画像の適用を動的にセット
            document.getElementById('loadingScreen').style.backgroundImage = `linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.5)), url('${WELCOME_IMAGE_URL}')`;

            const container = document.getElementById('slideContainer');
            
            imgElement1 = document.createElement('img');
            imgElement2 = document.createElement('img');
            container.appendChild(imgElement1);
            container.appendChild(imgElement2);

            await fetchImagesAndRefresh(true);

            slideTimer = setInterval(nextSlide, 4000);
            setInterval(checkFirebaseTrigger, 3000);
        };

        async function checkFirebaseTrigger() {
            try {
                const response = await fetch(FIREBASE_DB_URL);
                const data = await response.json();
                
                if (data && data.timestamp) {
                    if (lastKnownTimestamp === null) {
                        lastKnownTimestamp = data.timestamp;
                    } else if (data.timestamp > lastKnownTimestamp) {
                        lastKnownTimestamp = data.timestamp;
                        await fetchImagesAndRefresh(false, true);

                        clearInterval(slideTimer);
                        slideTimer = setInterval(nextSlide, 4000);
                    }
                }
            } catch (e) {
                console.error('Firebase確認エラー:', e);
            }
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        async function fetchImagesAndRefresh(isInitial = false, isInterrupt = false) {
            try {
                const response = await fetch(GAS_WEB_APP_URL, {
                    method: "GET",
                    redirect: "follow" 
                });

                const data = await response.json();
                
                if (data.status === 'success' && data.images.length > 0) {
                    images = shuffleArray(data.images);

                    if (isInitial || isInterrupt) {
                        currentIndex = 0;
                        showImage(currentIndex);

                        // 初回データ取得＆最初の画像セットが完了したらローディング画面をフェードアウト
                        if (isFirstLoad) {
                            isFirstLoad = false;
                            const loadingScreen = document.getElementById('loadingScreen');
                            loadingScreen.classList.add('fade-out');
                            setTimeout(() => {
                                loadingScreen.style.display = 'none';
                            }, 1200); // 遷移アニメーション完了後に要素を完全に消去
                        }
                    }
                }
            } catch (e) {
                console.error('画像データ取得エラー:', e);
            }
        }

        function getShownMessages() {
            try {
                return JSON.parse(localStorage.getItem(SHOWN_MESSAGES_KEY) || '[]');
            } catch (e) { return []; }
        }

        function markMessageAsShown(id) {
            try {
                const shown = getShownMessages();
                if (!shown.includes(id)) {
                    shown.push(id);
                    localStorage.setItem(SHOWN_MESSAGES_KEY, JSON.stringify(shown));
                }
            } catch (e) {}
        }

        function showImage(index) {
            if (images.length === 0) return;
            const currentItem = images[index];
            const imageUrl = currentItem.url;
            const message = currentItem.message;
            const author = currentItem.author;
            const imageId = currentItem.id;

            if (useFirstImage) {
                imgElement1.src = imageUrl;
                imgElement1.classList.add('active');
                imgElement2.classList.remove('active');
            } else {
                imgElement2.src = imageUrl;
                imgElement2.classList.add('active');
                imgElement1.classList.remove('active');
            }
            useFirstImage = !useFirstImage;

            const commentEl = document.getElementById('commentOverlay');
            commentEl.classList.remove('show');
            void commentEl.offsetWidth;

            const shownList = getShownMessages();
            const hasMessage = message && message.trim() !== "";
            const isFirstTime = hasMessage && !shownList.includes(imageId);

            if (isFirstTime) {
                document.getElementById('commentAuthor').innerText = author ? `${author} 様からのメッセージ` : 'ゲストからのメッセージ';
                document.getElementById('commentText').innerText = message;
                commentEl.classList.add('show');
                markMessageAsShown(imageId);
            }
        }

        function nextSlide() {
            if (images.length === 0) return;
            currentIndex = (currentIndex + 1) % images.length;
            if (currentIndex === 0) {
                shuffleArray(images);
            }
            showImage(currentIndex);
        }
    </script>
</body>
</html>
