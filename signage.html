<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>L'Eternel Moment - Wedding Signage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Shippori+Mincho:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #0c0b0a;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Shippori Mincho', serif;
        }

        /* 🚪 起動時ラグジュアリー・スプラッシュ画面 */
        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* 
              ★ ここで背景画像を綺麗に見せつつ、文字をくっきり際立たせるためのフィルター（グラデーション）を重ねています。
              url('ここに任意の画像URLを入れてください') の部分を変更してください。
            */
            background: linear-gradient(rgba(12, 11, 10, 0.55), rgba(12, 11, 10, 0.82)), 
                        url('https://drive.google.com/uc?export=view&id=1ePvmQtV_J-GOBjYiyYDJpWY5HeYGYJME') center/cover no-repeat;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: opacity 1.5s ease-in-out;
        }
        #loadingScreen.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .splash-subtitle {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.15rem;
            letter-spacing: 0.35em;
            color: #d4af37;
            text-transform: uppercase;
            margin-bottom: 14px;
            font-weight: 600;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .splash-title {
            font-family: 'Shippori Mincho', serif;
            font-size: 3.2rem;
            letter-spacing: 0.15em;
            color: #ffffff;
            margin-bottom: 18px;
            font-weight: 500;
            text-shadow: 0 4px 25px rgba(0,0,0,0.8);
        }

        .splash-date {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.3rem;
            letter-spacing: 0.25em;
            color: #e6c567;
            margin-bottom: 40px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        /* 右下の接続中インジケーター */
        .loading-indicator {
            position: absolute;
            bottom: 40px;
            right: 40px;
            background: rgba(20, 18, 16, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(212, 175, 55, 0.45);
            color: #fcfbfa;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 0.95rem;
            letter-spacing: 0.1em;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-top-color: #d4af37;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .slide-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        img.slide-img {
            max-width: 95%;
            max-height: 95%;
            object-fit: contain;
            position: absolute;
            opacity: 0;
            transition: opacity 1.2s ease-in-out, transform 1.2s ease-in-out;
            transform: scale(0.98);
            border-radius: 4px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }
        img.slide-img.active {
            opacity: 1;
            transform: scale(1);
        }

        /* ☁️ クラウド型メッセージ枠 */
        .comment-overlay {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(40px);
            background: rgba(25, 23, 20, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1.5px solid rgba(212, 175, 55, 0.5);
            color: #fcfbfa;
            padding: 26px 45px;
            border-radius: 60px / 45px;
            box-shadow: 
                0 20px 50px rgba(0,0,0,0.7), 
                inset 0 0 20px rgba(212, 175, 55, 0.15);
            max-width: 75%;
            text-align: center;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
        }

        .comment-overlay::before,
        .comment-overlay::after {
            content: '';
            position: absolute;
            background: rgba(25, 23, 20, 0.88);
            border: 1.5px solid rgba(212, 175, 55, 0.45);
            border-radius: 50%;
            z-index: -1;
        }
        .comment-overlay::before { width: 70px; height: 70px; top: -25px; left: 35px; }
        .comment-overlay::after { width: 90px; height: 90px; top: -35px; right: 40px; }

        .comment-overlay.show {
            animation: floatUpAndFade 5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes floatUpAndFade {
            0% { opacity: 0; transform: translateX(-50%) translateY(50px) scale(0.92); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0px) scale(1); }
            75% { opacity: 1; transform: translateX(-50%) translateY(-40px) scale(1); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-80px) scale(0.96); }
        }

        .comment-author {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.05rem;
            letter-spacing: 0.18em;
            color: #e6c567;
            margin-bottom: 6px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .comment-text {
            font-size: 1.4rem;
            letter-spacing: 0.08em;
            line-height: 1.6;
            color: #ffffff;
            font-weight: 400;
        }
    </style>
</head>
<body>

    <!-- 🚪 アプリ起動時スプラッシュ画面 -->
    <div id="loadingScreen">
        <div class="splash-subtitle">REAL-TIME PHOTO & MESSAGE SYNC</div>
        <div class="splash-title">L'Éternel Moment</div>
        <div class="splash-date">October 25, 2026</div>

        <div class="loading-indicator">
            <div class="spinner"></div>
            <span id="loadingText">システム接続中...</span>
        </div>
    </div>

    <div class="slide-container" id="slideContainer"></div>
    <div id="commentOverlay" class="comment-overlay">
        <div id="commentAuthor" class="comment-author"></div>
        <div id="commentText" class="comment-text"></div>
    </div>

    <script>
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz4XPN95bV-owJeowXFzQ9Z0OIBgI6S31C8QqvX7TdCAas6ZRYes8itFWDy9wSJB6fVhg/exec"; // ★デプロイしたGASのURL
        const FIREBASE_DB_URL = "https://signageresource-syncsystem-default-rtdb.firebaseio.com/trigger.json";

        let images = [];
        let currentIndex = 0;
        let imgElement1, imgElement2;
        let useFirstImage = true;
        let slideTimer = null;
        let lastKnownTimestamp = null;
        let isFirstLoad = true;

        const SHOWN_BATCHES_KEY = "wedding_shown_batches_v1";

        window.onload = async function() {
            const container = document.getElementById('slideContainer');
            
            imgElement1 = document.createElement('img');
            imgElement1.className = 'slide-img';
            imgElement2 = document.createElement('img');
            imgElement2.className = 'slide-img';
            container.appendChild(imgElement1);
            container.appendChild(imgElement2);

            await fetchImagesAndRefresh(true);

            slideTimer = setInterval(nextSlide, 4000);
            setInterval(checkFirebaseTrigger, 3000);
        };

        async function checkFirebaseTrigger() {
            try {
                const response = await fetch(FIREBASE_DB_URL);
                const data = await response.json();
                
                if (data && data.timestamp) {
                    if (lastKnownTimestamp === null) {
                        lastKnownTimestamp = data.timestamp;
                    } else if (data.timestamp > lastKnownTimestamp) {
                        lastKnownTimestamp = data.timestamp;
                        await fetchImagesAndRefresh(false, true);

                        clearInterval(slideTimer);
                        slideTimer = setInterval(nextSlide, 4000);
                    }
                }
            } catch (e) {
                console.error('Firebase確認エラー:', e);
            }
        }

        function organizeImages(rawImages) {
            const batchMap = {};
            rawImages.forEach(img => {
                const bId = img.batchId || "default";
                if (!batchMap[bId]) batchMap[bId] = [];
                batchMap[bId].push(img);
            });

            Object.keys(batchMap).forEach(bId => {
                batchMap[bId].sort((a, b) => a.createdTime - b.createdTime);
            });

            let batches = Object.values(batchMap);
            for (let i = batches.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [batches[i], batches[j]] = [batches[j], batches[i]];
            }

            return batches.flat();
        }

        async function fetchImagesAndRefresh(isInitial = false, isInterrupt = false) {
            try {
                const response = await fetch(GAS_WEB_APP_URL, {
                    method: "GET",
                    redirect: "follow" 
                });

                const data = await response.json();
                
                if (data.status === 'success' && data.images.length > 0) {
                    images = organizeImages(data.images);

                    if (isInitial || isInterrupt) {
                        currentIndex = 0;
                        showImage(currentIndex);

                        if (isFirstLoad) {
                            isFirstLoad = false;
                            const loadingScreen = document.getElementById('loadingScreen');
                            loadingScreen.classList.add('fade-out');
                            setTimeout(() => {
                                loadingScreen.style.display = 'none';
                            }, 1500);
                        }
                    }
                }
            } catch (e) {
                console.error('画像データ取得エラー:', e);
            }
        }

        function getShownBatches() {
            try {
                return JSON.parse(localStorage.getItem(SHOWN_BATCHES_KEY) || '[]');
            } catch (e) { return []; }
        }

        function markBatchAsShown(batchId) {
            try {
                const shown = getShownBatches();
                if (!shown.includes(batchId)) {
                    shown.push(batchId);
                    localStorage.setItem(SHOWN_BATCHES_KEY, JSON.stringify(shown));
                }
            } catch (e) {}
        }

        function showImage(index) {
            if (images.length === 0) return;
            const currentItem = images[index];
            const imageUrl = currentItem.url;
            const message = currentItem.message;
            const author = currentItem.author;
            const batchId = currentItem.batchId || "default";

            if (useFirstImage) {
                imgElement1.src = imageUrl;
                imgElement1.classList.add('active');
                imgElement2.classList.remove('active');
            } else {
                imgElement2.src = imageUrl;
                imgElement2.classList.add('active');
                imgElement1.classList.remove('active');
            }
            useFirstImage = !useFirstImage;

            const commentEl = document.getElementById('commentOverlay');
            commentEl.classList.remove('show');
            void commentEl.offsetWidth;

            const shownBatches = getShownBatches();
            const hasMessage = message && message.trim() !== "";
            const isFirstTimeForBatch = hasMessage && !shownBatches.includes(batchId);

            if (isFirstTimeForBatch) {
                document.getElementById('commentAuthor').innerText = author ? `${author} 様からのメッセージ` : 'ゲストからのメッセージ';
                document.getElementById('commentText').innerText = message;
                commentEl.classList.add('show');
                markBatchAsShown(batchId);
            }
        }

        function nextSlide() {
            if (images.length === 0) return;
            currentIndex = (currentIndex + 1) % images.length;
            if (currentIndex === 0) {
                images = organizeImages(images);
            }
            showImage(currentIndex);
        }
    </script>
</body>
</html>
