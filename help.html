<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>お問い合わせ - SharetheMoments</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />

  <style>
    :root {
      --font-title: 'Cinzel', serif;
      --font-serif: 'Shippori Mincho', serif;
      --font-sans: 'Noto Sans JP', sans-serif;
      --primary-gold: #b89753;
      --gold-accent: linear-gradient(135deg, #d4af37 0%, #f3e5ab 50%, #aa7c11 100%);
      --gold-border: rgba(212, 175, 55, 0.45);
      --text-main: #2b2b2b;
      --text-sub: #64748b;
      --border-radius: 20px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    .material-symbols-rounded { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; font-size: 1.2rem; color: var(--primary-gold); }

    /* 📱 ホーム画面と同様のフルスクリーン＆ノッチ対応背景設定 */
    body {
      font-family: var(--font-sans); 
      min-height: 100vh; min-height: 100dvh; 
      display: flex; justify-content: center; align-items: center; 
      padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom)) 16px; 
      color: var(--text-main); 
      position: relative; overflow-x: hidden;
      /* GitHub上の画像リソースを指定（同じリポジトリ内であれば ./help-screen.JPEG） */
      background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.4)), url('./help-screen.JPEG');
      background-size: cover; background-position: center; background-repeat: no-repeat;
    }

    .container {
      width: 100%; max-width: 380px; 
      background: rgba(255, 255, 255, 0.72) !important; 
      backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
      border: 1.5px solid rgba(255, 255, 255, 0.9);
      border-radius: var(--border-radius); 
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2); 
      padding: 24px 16px; 
      position: relative; z-index: 1;
    }
    .title-area { text-align: center; margin-bottom: 20px; }
    .en-sub { font-family: var(--font-title); font-size: 0.9rem; letter-spacing: 0.22em; color: var(--primary-gold); font-weight: 700; display: block; margin-bottom: 4px; }
    h2 { font-family: var(--font-serif); font-size: 1.25rem; font-weight: 700; color: var(--text-main); letter-spacing: 0.05em; }

    .input-group { margin-bottom: 16px; text-align: left; }
    .input-group label { display: block; font-size: 0.78rem; font-weight: 700; margin-bottom: 4px; color: var(--text-main); }
    .required-badge { background: #e11d48; color: white; padding: 3px 7px; border-radius: 6px; font-size: 0.65rem; margin-left: 8px; font-weight: 700; display: inline-block; }

    .table-trigger-btn, .text-input-field {
      width: 100%; padding: 12px 18px; border: 1.5px solid rgba(255, 255, 255, 0.9); border-radius: 16px; font-size: 0.9rem; background: rgba(255, 255, 255, 0.85); color: var(--text-main); outline: none; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02); transition: all 0.2s ease;
    }
    .table-trigger-btn { display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-weight: 600; }
    .table-trigger-btn.selected { border-color: var(--primary-gold); color: var(--primary-gold); }
    .text-input-field:focus { border-color: var(--primary-gold); background: rgba(255, 255, 255, 1); }
    .text-input-field::placeholder { color: #94a3b8; }
    textarea.text-input-field { resize: none; height: 110px; font-family: var(--font-sans); }

    .btn { width: 100%; padding: 13px 16px; border-radius: 14px; font-size: 0.92rem; font-weight: 700; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; transition: all 0.2s ease; outline: none; border: none; }
    .btn:active { transform: scale(0.97); }
    .btn-primary { font-family: var(--font-serif); background: linear-gradient(135deg, #e4cb91 0%, #b89753 100%); color: #ffffff; box-shadow: 0 6px 15px rgba(184, 151, 83, 0.3); }
    .btn-primary:disabled { background: #cbd5e1; color: #94a3b8; box-shadow: none; cursor: not-allowed; }
    .btn-secondary { background: rgba(255, 255, 255, 0.6); color: #475569; border: 1px solid rgba(255, 255, 255, 0.8); margin-top: 10px; }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.45); backdrop-filter: blur(10px); z-index: 999; display: flex; justify-content: center; align-items: center; padding: 20px; opacity: 0; visibility: hidden; transition: all 0.25s ease; }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .modal-content { width: 100%; max-width: 320px; background: rgba(30, 41, 59, 0.95); border: 1px solid var(--gold-border); border-radius: 18px; padding: 12px 8px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4); transform: scale(0.9); transition: all 0.25s; }
    .modal-overlay.active .modal-content { transform: scale(1); }
    .table-modal-header { font-family: var(--font-title); font-size: 0.85rem; letter-spacing: 0.2em; color: #e2e8f0; text-align: center; padding: 8px 0 12px; font-weight: 700; }
    .table-list-container { max-height: 280px; overflow-y: auto; padding: 0 4px; }
    .table-list-container::-webkit-scrollbar { width: 4px; }
    .table-list-container::-webkit-scrollbar-thumb { background: rgba(212, 175, 55, 0.4); border-radius: 4px; }
    .table-list-item { padding: 12px 16px; border-radius: 10px; font-family: var(--font-en); font-size: 0.92rem; color: rgba(255, 255, 255, 0.9); display: flex; align-items: center; gap: 10px; cursor: pointer; margin-bottom: 2px; letter-spacing: 0.08em; }
    .table-list-item.selected { background: linear-gradient(135deg, rgba(212, 175, 55, 0.85) 0%, rgba(170, 124, 17, 0.85) 100%); color: #ffffff; font-weight: 700; border: 1px solid rgba(255, 255, 255, 0.3); }
  </style>
</head>
<body>

  <div class="container">
    <div class="title-area">
      <span class="en-sub">HELP &amp; SUPPORT</span>
      <h2>お問い合わせ</h2>
    </div>
    <p style="text-align:center; font-size:0.8rem; color:var(--text-sub); margin-bottom:18px;">アプリの操作でお困りの際はこちらからご連絡ください。</p>

    <div class="input-group">
      <label>テーブル番号 <span class="required-badge">必須</span></label>
      <div id="table-trigger" class="table-trigger-btn" onclick="openTableModal()">
        <span id="table-trigger-text">SELECT TABLE</span>
        <span class="material-symbols-rounded" style="font-size:1.2rem; color:#94a3b8;">expand_more</span>
      </div>
      <input type="hidden" id="table-no" value="">
    </div>

    <div class="input-group">
      <label for="user-name">お名前・ニックネーム <span class="required-badge">必須</span></label>
      <input type="text" id="user-name" class="text-input-field" placeholder="例：山田 太郎" maxlength="20" oninput="validateForm()">
    </div>

    <div class="input-group" style="margin-bottom: 20px;">
      <label for="user-message">問い合わせ内容 <span class="required-badge">必須</span></label>
      <textarea id="user-message" class="text-input-field" placeholder="例：写真がうまく送れません。エラーメッセージが出ます。" maxlength="200" oninput="validateForm()"></textarea>
    </div>

    <button id="submit-btn" class="btn btn-primary" disabled onclick="sendInquiry()">
      <span class="material-symbols-rounded">send</span>送信する
    </button>
    <button class="btn btn-secondary" onclick="location.href='index.html'">
      <span class="material-symbols-rounded">home</span>ホームに戻る
    </button>
    <div id="status" style="font-size: 0.8rem; text-align: center; font-weight: 700; margin-top: 10px; line-height: 1.5;"></div>
  </div>

  <div id="table-modal" class="modal-overlay" onclick="closeTableModalOnOutside(event)">
    <div class="modal-content">
      <div class="table-modal-header">SELECT TABLE</div>
      <div class="table-list-container" id="table-list-container"></div>
    </div>
  </div>

  <script>
    const tables = ['Table A','Table B','Table C','Table D','Table E','Table F','Table G','Table H','Table I','Table J','Table K','Table L','Table M','Table N','Table O','Table P','Table Q'];
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz4XPN95bV-owJeowXFzQ9Z0OIBgI6S31C8QqvX7TdCAas6ZRYes8itFWDy9wSJB6fVhg/exec";

    window.addEventListener('DOMContentLoaded', () => {
      initTableList();
    });

    function initTableList() {
      const container = document.getElementById('table-list-container');
      container.innerHTML = '';
      tables.forEach(tableVal => {
        const item = document.createElement('div');
        item.className = 'table-list-item';
        item.innerHTML = `<span class="material-symbols-rounded check-mark" style="visibility:hidden; color:white; font-size:1.1rem;">check</span><span>${tableVal}</span>`;
        item.onclick = () => {
          document.getElementById('table-no').value = tableVal;
          document.getElementById('table-trigger-text').innerText = `✓ ${tableVal}`;
          document.getElementById('table-trigger').classList.add('selected');
          document.querySelectorAll('.table-list-item').forEach(i => { i.classList.remove('selected'); i.querySelector('.check-mark').style.visibility = 'hidden'; });
          item.classList.add('selected');
          item.querySelector('.check-mark').style.visibility = 'visible';
          validateForm();
          setTimeout(() => document.getElementById('table-modal').classList.remove('active'), 200);
        };
        container.appendChild(item);
      });
    }

    function openTableModal() { document.getElementById('table-modal').classList.add('active'); }
    function closeTableModalOnOutside(e) { if (e.target.id === 'table-modal') document.getElementById('table-modal').classList.remove('active'); }

    function validateForm() {
      const tableNo = document.getElementById('table-no').value.trim();
      const name = document.getElementById('user-name').value.trim();
      const message = document.getElementById('user-message').value.trim();
      const submitBtn = document.getElementById('submit-btn');

      if (tableNo && name && message) {
        submitBtn.removeAttribute('disabled');
      } else {
        submitBtn.setAttribute('disabled', 'true');
      }
    }

    async function sendInquiry() {
      const tableNo = document.getElementById('table-no').value.trim();
      const name = document.getElementById('user-name').value.trim();
      const message = document.getElementById('user-message').value.trim();
      const statusEl = document.getElementById('status');
      const submitBtn = document.getElementById('submit-btn');

      if (!tableNo || !name || !message) return;

      submitBtn.style.display = 'none';
      statusEl.style.color = 'var(--text-main)';
      statusEl.innerText = '送信中...';

      try {
        const response = await fetch(GAS_WEB_APP_URL, {
          method: "POST",
          redirect: "follow",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ type: "inquiry", tableNo: tableNo, userName: name, userMessage: message })
        });
        const res = await response.json();
        if (!res.success) throw new Error(res.error || "送信に失敗しました");

        // 🟢 送信成功：5秒のウェイト処理とメッセージ表示
        statusEl.style.color = '#15803d';
        statusEl.innerHTML = 'お問い合わせを送信しました。<br>まもなく起動画面（ホーム）に戻ります...';
        
        setTimeout(() => {
          location.href = 'index.html';
        }, 5000); // 5000ミリ秒（5秒）待機

      } catch (err) {
        statusEl.style.color = '#c53030';
        statusEl.innerText = 'エラー: ' + err.message;
        submitBtn.style.display = 'flex';
      }
    }
  </script>
</body>
</html>
