<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Console - Share the Moments</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="admin-body">

  <!-- パスコード認証画面 -->
  <div id="authScreen" class="admin-auth-container">
    <div class="auth-box">
      <h2>管理者ログイン</h2>
      <p>管理パスコードを入力してください</p>
      <input type="password" id="passcodeInput" placeholder="パスコード">
      <button id="loginBtn" class="btn-primary">ログイン</button>
    </div>
  </div>

  <!-- 管理コンソールメイン画面（初期状態は非表示） -->
  <div id="adminMainScreen" class="admin-main-container" style="display: none;">
    <header class="admin-header">
      <h1>新郎新婦 管理コンソール</h1>
      <button id="logoutBtn" class="btn-secondary">ログアウト</button>
    </header>

    <main class="admin-content">
      <!-- セクション1: サイネージ機能制御 -->
      <section class="admin-card">
        <h3>サイネージ機能 制御</h3>
        <p>会場のサイネージ投影画面の利用有無を切り替えます。</p>
        <div class="toggle-wrapper">
          <label class="switch">
            <input type="checkbox" id="signageToggle">
            <span class="slider round"></span>
          </label>
          <span id="toggleStatusLabel">読み込み中...</span>
        </div>
        <button id="saveSettingsBtn" class="btn-primary">設定を保存</button>
      </section>

      <!-- セクション2: 問い合わせ一覧 -->
      <section class="admin-card">
        <h3>ゲストからの問い合わせ</h3>
        <div id="inquiryListContainer">
          <p>（管理画面からの問い合わせ確認機能）</p>
        </div>
      </section>
    </main>
  </div>

  <!-- ES Modulesとしてadmin.jsを読み込み -->
  <script type="module" src="./js/admin.js"></script>
</body>
</html>
